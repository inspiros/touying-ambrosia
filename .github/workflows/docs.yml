name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/*.md'
      - 'docs/site/**'
      - 'src/**'
      - 'assets/**'
      - 'typst.toml'
      - 'scripts/build-docs.py'
      - 'scripts/install.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/*.md'
      - 'docs/site/**'
      - 'src/**'
      - 'assets/**'
      - 'typst.toml'
      - 'scripts/build-docs.py'
      - 'scripts/install.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: '0.5.4'
  MDBOOK_SHA256: '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: '0.15.1'
      - name: Install example fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra
      - name: Install verified mdBook release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"
      - name: Compile examples, build the book, and validate links
        run: python3 -u scripts/build-docs.py --pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
