name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: '0.15.1'
      - name: Install PDF inspection tools and test fonts
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core fonts-dejavu-extra
      - name: Check local package installation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check slides, utilities, notes exports, and installed starter
        run: python3 -u tests/ci.py
